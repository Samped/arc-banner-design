<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ARC Banner</title>
  <meta name="description" content="Personalize the ARC community banner with your profile photo. Export as SVG or PNG." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Syne:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-inner">
        <p class="eyebrow">ARC Community</p>
        <h1>Banner Studio</h1>
        <p class="lede">Add your photo. Export when it feels right.</p>
      </div>
    </header>

    <main class="layout">
      <section class="panel preview-panel" aria-label="Banner preview">
        <div class="panel-head">
          <h2>Preview</h2>
        </div>
        <div id="preview-wrap" class="preview-wrap">
          <div id="preview-loading" class="loading">Loading…</div>
          <div id="preview" class="preview" hidden></div>
        </div>
      </section>

      <section class="panel controls" aria-label="Customization options">
        <div class="panel-head">
          <h2>Edit</h2>
        </div>

        <label class="upload-zone" for="avatar-input">
          <span class="upload-zone-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 5v14M5 12h14" />
            </svg>
          </span>
          <span class="upload-zone-title">Upload photo</span>
          <span class="upload-zone-hint">PNG, JPG, WebP</span>
        </label>
        <input type="file" id="avatar-input" class="sr-only" accept="image/*" />

        <div id="avatar-adjust" class="avatar-adjust" hidden>
          <p class="adjust-label">Position</p>
          <div id="avatar-cropper" class="avatar-cropper" aria-label="Drag to reposition profile photo">
            <img id="cropper-image" alt="" draggable="false" />
            <div class="avatar-cropper-ring" aria-hidden="true"></div>
          </div>
          <p class="hint crop-hint">Drag to move · scroll to zoom</p>
          <label class="slider-field">
            <span class="slider-label">Zoom</span>
            <input type="range" id="zoom-input" min="1" max="3" step="0.01" value="1" />
          </label>
          <button type="button" id="reset-avatar" class="btn ghost">Reset</button>
        </div>

        <div class="actions">
          <button type="button" id="download-png" class="btn primary">Download PNG</button>
          <button type="button" id="download-svg" class="btn secondary">Download SVG</button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <a href="arc-banner-template.svg" download>Template</a>
      <span class="footer-dot" aria-hidden="true"></span>
      <a href="https://github.com/Samped/arc-banner-design" id="repo-link" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </div>

  <script src="customizer.js"></script>
</body>
</html>
